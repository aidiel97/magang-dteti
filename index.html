const track = document.getElementById('track');
const counterEl = document.getElementById('counter');
const detailEl = document.getElementById('detail');
const detailContent = document.getElementById('detail-content');
let current = 0;

function badgeClass(p) {
  if (p.includes('TIF') && p.includes('TB')) return 'badge-both';
  if (p === 'TIF') return 'badge-tif';
  return 'badge-tb';
}
function badgeLabel(p) {
  if (p.includes('TIF') && p.includes('TB')) return 'TIF & TB';
  return p;
}

function logoEl(src, alt, cls) {
  if (src) return `<img class="${cls}" src="${src}" alt="${alt}">`;
  return `<div class="${cls}">${alt}</div>`;
}

MITRA.forEach((m, i) => {
  const slide = document.createElement('div');
  slide.className = 'slide';
  slide.setAttribute('role', 'group');
  slide.setAttribute('aria-label', `Mitra ${i+1} dari ${MITRA.length}: ${m.name}`);
  slide.innerHTML = `
    ${logoEl(m.logo, m.short, 'mitra-logo-box')}
    <div class="mitra-name">${m.name}</div>
    <span class="badge ${badgeClass(m.prodi)}">${badgeLabel(m.prodi)}</span>
    <span class="tap-hint">Ketuk untuk detail</span>
  `;
  slide.addEventListener('click', () => openDetail(i));
  track.appendChild(slide);
});

function goTo(idx) {
  if (idx < 0) idx = MITRA.length - 1;
  if (idx >= MITRA.length) idx = 0;
  current = idx;
  track.style.transform = `translateX(-${current * 100}%)`;
  counterEl.textContent = `${current + 1} / ${MITRA.length}`;
}

// Touch/swipe
let startX = 0, diffX = 0, dragging = false;
const carouselEl = document.getElementById('carousel');

carouselEl.addEventListener('touchstart', e => {
  startX = e.touches[0].clientX;
  dragging = true;
  track.classList.add('dragging');
}, { passive: true });

carouselEl.addEventListener('touchmove', e => {
  if (!dragging) return;
  diffX = e.touches[0].clientX - startX;
  const offset = -(current * window.innerWidth) + diffX;
  track.style.transform = `translateX(${offset}px)`;
}, { passive: true });

carouselEl.addEventListener('touchend', () => {
  if (!dragging) return;
  dragging = false;
  track.classList.remove('dragging');
  if (Math.abs(diffX) > 50) {
    if (diffX < 0) goTo(current + 1);
    else goTo(current - 1);
  } else {
    goTo(current);
  }
  diffX = 0;
});

// Keyboard
document.addEventListener('keydown', e => {
  if (detailEl.classList.contains('open')) {
    if (e.key === 'Escape') closeDetail();
    return;
  }
  if (e.key === 'ArrowRight') goTo(current + 1);
  if (e.key === 'ArrowLeft') goTo(current - 1);
  if (e.key === 'Enter') openDetail(current);
});

// Detail
function parseMK(str) {
  if (!str) return [];
  return str.split(';').map(s => s.trim()).filter(Boolean).map(s => {
    const match = s.match(/^([A-Z]+\d+)\s+(.+?)(?:\s*\((\d+)\))?$/);
    if (match) return { kode: match[1], nama: match[2], sks: match[3] };
    return { kode: '', nama: s, sks: '' };
  });
}

function openDetail(idx) {
  const m = MITRA[idx];
  let html = `
    <div class="detail-header">
      ${logoEl(m.logo, m.short, 'detail-logo')}
      <div>
        <div class="detail-mitra-name">${m.name}</div>
        <span class="badge ${badgeClass(m.prodi)}" style="margin-top:6px;display:inline-block">${badgeLabel(m.prodi)}</span>
      </div>
    </div>
    <div class="section-label">Topik Magang & Rekomendasi MK Pilihan</div>
  `;

  m.topik.forEach(tp => {
    const mkTif = parseMK(tp.tif);
    const mkTb = parseMK(tp.tb);

    html += `<div class="topik-card">
      <div class="topik-title">${tp.t}</div>
      <div class="topik-kuota">Kuota: ${tp.kuota}</div>`;

    if (mkTif.length > 0) {
      html += `<div class="mk-label tif">Rekomendasi MK TIF</div><ul class="mk-list">`;
      mkTif.forEach(mk => {
        html += `<li class="mk-item"><code>${mk.kode}</code> ${mk.nama}${mk.sks ? ` (${mk.sks} SKS)` : ''}</li>`;
      });
      html += `</ul>`;
    }

    if (mkTb.length > 0) {
      html += `<div class="mk-label tb">Rekomendasi MK TB</div><ul class="mk-list">`;
      mkTb.forEach(mk => {
        html += `<li class="mk-item"><code>${mk.kode}</code> ${mk.nama}${mk.sks ? ` (${mk.sks} SKS)` : ''}</li>`;
      });
      html += `</ul>`;
    }

    html += `</div>`;
  });

  detailContent.innerHTML = html;
  detailEl.classList.add('open');
}

function closeDetail() {
  detailEl.classList.remove('open');
}

window.carousel = { prev: () => goTo(current - 1), next: () => goTo(current + 1) };
</script>
