/* ── helpers ── */
function badgeClass(p) {
  if (p.includes('TIF') && p.includes('TB')) return 'badge-both';
  if (p === 'TIF') return 'badge-tif';
  return 'badge-tb';
}
function badgeLabel(p) {
  if (p.includes('TIF') && p.includes('TB')) return 'TIF & TB';
  return p;
}
function logoEl(src, alt, cls) {
  if (src) return `<img class="${cls}" src="${src}" alt="${alt}">`;
  return `<div class="${cls}">${alt}</div>`;
}
function parseMK(str) {
  if (!str) return [];
  return str.split(';').map(s => s.trim()).filter(Boolean).map(s => {
    const match = s.match(/^([A-Z]+\d+)\s+(.+?)(?:\s*\((\d+)\))?$/);
    if (match) return { kode: match[1], nama: match[2], sks: match[3] };
    return { kode: '', nama: s, sks: '' };
  });
}

/* ── build drum items ── */
const drumTrack = document.getElementById('drumTrack');
const drum = document.getElementById('drum');
const detailEl = document.getElementById('detail');
const detailContent = document.getElementById('detail-content');

const ITEM_H = 100; // px height per item

MITRA.forEach((m, i) => {
  const el = document.createElement('div');
  el.className = 'drum-item';
  el.dataset.idx = i;
  el.innerHTML = `
    ${logoEl(m.logo, m.short, 'drum-logo')}
    <div class="drum-info">
      <div class="drum-name">${m.name}</div>
      <div class="drum-meta">
        <span class="badge ${badgeClass(m.prodi)}">${badgeLabel(m.prodi)}</span>
        <span class="drum-count">${m.topik.length} topik</span>
      </div>
    </div>
  `;
  el.addEventListener('click', () => {
    const center = getCenterIdx();
    if (i === center) {
      openDetail(i);
    } else {
      scrollToIdx(i);
    }
  });
  drumTrack.appendChild(el);
});

/* ── scroll-driven effects ── */
const items = drumTrack.querySelectorAll('.drum-item');

function getCenterIdx() {
  const drumRect = drum.getBoundingClientRect();
  const centerY = drumRect.top + drumRect.height / 2;
  let closest = 0, minDist = Infinity;
  items.forEach((el, i) => {
    const r = el.getBoundingClientRect();
    const d = Math.abs(r.top + r.height / 2 - centerY);
    if (d < minDist) { minDist = d; closest = i; }
  });
  return closest;
}

function updateEffects() {
  const drumRect = drum.getBoundingClientRect();
  const centerY = drumRect.top + drumRect.height / 2;
  const maxDist = drumRect.height / 2;

  items.forEach(el => {
    const r = el.getBoundingClientRect();
    const itemCenterY = r.top + r.height / 2;
    const dist = Math.abs(itemCenterY - centerY);
    const ratio = Math.min(dist / maxDist, 1); // 0 = center, 1 = edge

    const scale = 1 - ratio * 0.25;         // 1.0 → 0.75
    const blur = ratio * 6;                  // 0 → 6px
    const opacity = 1 - ratio * 0.6;        // 1.0 → 0.4
    const rotateX = (itemCenterY - centerY) / maxDist * -15; // tilt

    el.style.transform = `perspective(800px) rotateX(${rotateX}deg) scale(${scale})`;
    el.style.filter = `blur(${blur}px)`;
    el.style.opacity = opacity;
  });

  requestAnimationFrame(updateEffects);
}

function scrollToIdx(i) {
  const drumRect = drum.getBoundingClientRect();
  const targetY = items[i].offsetTop - drum.scrollTop + items[i].offsetHeight / 2;
  const drumCenter = drumRect.height / 2;
  drum.scrollBy({ top: items[i].offsetTop - drum.scrollTop - drumCenter + items[i].offsetHeight / 2, behavior: 'smooth' });
}

// Initial scroll to first item center
requestAnimationFrame(() => {
  const drumRect = drum.getBoundingClientRect();
  const padTop = drumRect.height / 2 - ITEM_H / 2;
  drumTrack.style.paddingTop = padTop + 'px';
  drumTrack.style.paddingBottom = padTop + 'px';
  updateEffects();
});

/* ── snap on scroll end ── */
let scrollTimer;
drum.addEventListener('scroll', () => {
  clearTimeout(scrollTimer);
  scrollTimer = setTimeout(() => {
    const idx = getCenterIdx();
    scrollToIdx(idx);
  }, 80);
}, { passive: true });

/* ── detail ── */
function openDetail(idx) {
  const m = MITRA[idx];
  let html = `
    <div class="detail-header">
      ${logoEl(m.logo, m.short, 'detail-logo')}
      <div>
        <div class="detail-mitra-name">${m.name}</div>
        <span class="badge ${badgeClass(m.prodi)}" style="margin-top:6px;display:inline-block">${badgeLabel(m.prodi)}</span>
      </div>
    </div>
    <div class="section-label">Topik Magang & Rekomendasi MK Pilihan</div>
  `;
  m.topik.forEach(tp => {
    const mkTif = parseMK(tp.tif);
    const mkTb = parseMK(tp.tb);
    html += `<div class="topik-card">
      <div class="topik-title">${tp.t}</div>
      <div class="topik-kuota">Kuota: ${tp.kuota}</div>`;
    if (mkTif.length > 0) {
      html += `<div class="mk-label tif">Rekomendasi MK TIF</div><ul class="mk-list">`;
      mkTif.forEach(mk => {
        html += `<li class="mk-item"><code>${mk.kode}</code> ${mk.nama}${mk.sks ? ` (${mk.sks} SKS)` : ''}</li>`;
      });
      html += `</ul>`;
    }
    if (mkTb.length > 0) {
      html += `<div class="mk-label tb">Rekomendasi MK TB</div><ul class="mk-list">`;
      mkTb.forEach(mk => {
        html += `<li class="mk-item"><code>${mk.kode}</code> ${mk.nama}${mk.sks ? ` (${mk.sks} SKS)` : ''}</li>`;
      });
      html += `</ul>`;
    }
    html += `</div>`;
  });
  detailContent.innerHTML = html;
  detailEl.classList.add('open');
  detailEl.scrollTop = 0;
}

function closeDetail() { detailEl.classList.remove('open'); }

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && detailEl.classList.contains('open')) closeDetail();
  if (detailEl.classList.contains('open')) return;
  const c = getCenterIdx();
  if (e.key === 'ArrowDown') scrollToIdx(Math.min(c + 1, MITRA.length - 1));
  if (e.key === 'ArrowUp') scrollToIdx(Math.max(c - 1, 0));
  if (e.key === 'Enter') openDetail(c);
});
